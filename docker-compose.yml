services:
  cowhand:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - COWHAND_USER=${COWHAND_USER}
      - COWHAND_PASS=${COWHAND_PASS}
      - PORT=3000
      - DB_PATH=/app/data/cowhand.sqlite
    volumes:
      - cowhand_data:/app/data

volumes:
  cowhand_data:
