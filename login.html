<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Orçamento Henrique &amp; Carol</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #faf6ee;
  --surface: #ffffff;
  --text: #1c2836;
  --text-muted: #948d7c;
  --line: #e6dcc7;
  --accent: #21426b;
  --accent-strong: #152c47;
  --accent-ink: #ffffff;
  --critical: #c8373a;
  --critical-soft: #fbe9e9;
  --shadow: 0 1px 2px rgba(28,24,12,0.06), 0 4px 16px rgba(28,24,12,0.05);
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #12151a;
    --surface: #1b1f26;
    --text: #f3efe4;
    --text-muted: #938f82;
    --line: #2e333c;
    --accent: #6c9bce;
    --accent-strong: #93bce3;
    --accent-ink: #0b1622;
    --critical: #e6716f;
    --critical-soft: #2a1414;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 20px rgba(0,0,0,0.35);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.card {
  width: 100%; max-width: 360px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 32px 28px;
}
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
.brand-mark { width: 40px; height: 40px; flex: none; display: block; }
h1 { font-family: "Sora", sans-serif; font-size: 18px; margin: 0; }
.sub { color: var(--text-muted); font-size: 13px; margin: 2px 0 0; }
.field { display: flex; flex-direction: column; gap: 6px; margin-top: 18px; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--text-muted); }
.field input {
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; font-size: 14.5px; color: var(--text); font: inherit;
}
.field input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button {
  width: 100%; margin-top: 22px; padding: 11px; border-radius: 8px; border: none;
  background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 700;
  font-size: 14.5px; cursor: pointer;
}
button:hover { background: var(--accent-strong); }
.error {
  margin-top: 18px; padding: 10px 12px; border-radius: 8px;
  background: var(--critical-soft); color: var(--critical); font-size: 13px; font-weight: 600;
}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><img class="brand-mark" src="/logo.png" alt="" width="40" height="40"><div><h1>Orçamento</h1><p class="sub">Henrique &amp; Carol</p></div></div>
  <!--ERROR-->
  <form method="POST" action="/api/login">
    <div class="field"><label for="username">Usuário</label><input type="text" id="username" name="username" autocomplete="username" required autofocus></div>
    <div class="field"><label for="password">Senha</label><input type="password" id="password" name="password" autocomplete="current-password" required></div>
    <button type="submit">Entrar</button>
  </form>
</div>
</body>
</html>
